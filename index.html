<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Durva Mam Will You Be My Valentine?</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        video {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        h1 { color: #d81b60; font-size: 24px; margin: 10px 0; }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 50px;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #yes-btn { background-color: #ff4081; color: white; }
        #no-btn { 
            background-color: #f5f5f5; 
            color: #757575;
            transition: 0.1s;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="proposal-section">
            <video autoplay loop muted playsinline>
                <source src="asking.mp4" type="video/mp4">
            </video>
            <h1> Durva Mam Will you be my Valentine?</h1>
            <div class="buttons">
                <button id="yes-btn">Yes</button>
                <button id="no-btn">No</button>
            </div>
        </div>
        
        <div id="success-section" class="hidden">
            <video autoplay loop muted playsinline>
                <source src="yay.mp4" type="video/mp4">
            </video>
            <h1>YAY! See you soon! 🎉❤️</h1>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const proposal = document.getElementById('proposal-section');
        const success = document.getElementById('success-section');

        // Logic to move the 'No' button
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // Logic for clicking 'Yes'
        yesBtn.addEventListener('click', () => {
            proposal.classList.add('hidden');
            success.classList.remove('hidden');
        });
    </script>
</body>
</html>
