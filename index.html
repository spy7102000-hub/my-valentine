<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durva Mam Will You Be My Valentine?</title>
    <style>
        /* This part handles the design (CSS) */
        body {
            background-color: #fce4ec; /* Soft pink background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Prevents scrollbars when button moves */
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        #main-gif {
            width: 100%;
            max-width: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        h1 { color: #d81b60; font-size: 22px; }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        #yes-btn { background-color: #ff4081; color: white; }
        #no-btn { 
            background-color: #f5f5f5; 
            color: #757575;
            transition: 0.1s; /* Makes the jump look faster */
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="proposal-section">
            <img id="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueHdicW16eHByZnh6eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/3oriO0OEdcRldUXf68/giphy.gif" alt="Cat GIF">
            <h1>Durva Mam Will you be my Valentine?</h1>
            <div class="buttons">
                <button id="yes-btn">Yes</button>
                <button id="no-btn">No</button>
            </div>
        </div>
        
        <div id="success-section" class="hidden">
            <img id="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueHdicW16eHByZnh6eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/l41lTjJp9m9zR4Y4U/giphy.gif" alt="Celebration GIF">
            <h1>YAY! See you soon! 🎉❤️</h1>
        </div>
    </div>

    <script>
        /* This part handles the "Magic" (JavaScript) */
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const proposal = document.getElementById('proposal-section');
        const success = document.getElementById('success-section');

        // Logic to move the 'No' button
        noBtn.addEventListener('mouseover', () => {
            // Get random position within the window
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            // Apply new position
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // Logic for clicking 'Yes'
        yesBtn.addEventListener('click', () => {
            proposal.classList.add('hidden');
            success.classList.remove('hidden');
        });
    </script>
</body>
</html>
