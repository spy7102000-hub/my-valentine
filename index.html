<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 380px;
        }
        img, video { 
            width: 100%; 
            max-height: 250px; 
            object-fit: contain; 
            border-radius: 15px; 
            margin-bottom: 20px; 
        }
        h1 { color: #d81b60; font-size: 22px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .buttons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; min-height: 50px; }
        button { padding: 12px 30px; font-size: 18px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
        #yes-btn { background-color: #ff4081; color: white; }
        #no-btn { background-color: #f5f5f5; color: #757575; transition: 0.1s; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <img id="display-image" src="page1.jpg" alt="Proposal Image">
        
        <video id="display-video" class="hidden" autoplay loop muted playsinline>
            <source src="yay.mp4" type="video/mp4">
        </video>

        <h1 id="question-text">Do you have a second? I have something important to ask you...</h1>
        
        <div class="buttons" id="button-group">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <script>
        const content = [
            { text: "You know you're my favorite person to talk to, right?", img: "page2.jpg" },
            { text: "So... will you make me the happiest person and be my Valentine?", img: "page3.jpg" },
            { text: "Since you said yes (finally!), are you ready for our surprise date?", img: "page4.jpg" }
        ];

        let currentStep = 0;
        const questionEl = document.getElementById('question-text');
        const imageEl = document.getElementById('display-image');
        const videoEl = document.getElementById('display-video');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');

        yesBtn.addEventListener('click', () => {
            if (currentStep < content.length) {
                // Update text and image for next page
                questionEl.innerText = content[currentStep].text;
                imageEl.src = content[currentStep].img;
                
                // Reset 'No' button position
                noBtn.style.position = 'static';
                currentStep++;
            } else {
                // Final 'YAY' Page
                questionEl.innerHTML = "YAY! I can't wait to see you! 🎉❤️";
                imageEl.classList.add('hidden'); // Hide the image
                videoEl.classList.remove('hidden'); // Show the video
                document.getElementById('button-group').classList.add('hidden'); // Hide buttons
            }
        });

        // Annoying moving button logic
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });
    </script>
</body>
</html>
